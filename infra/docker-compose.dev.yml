version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: openlearn
      POSTGRES_USER: openlearn
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=openlearn
      - KC_DB_PASSWORD=devpassword
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_dev_data:/opt/keycloak/data
    depends_on:
      - db

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      OPENLEARN_TEST_USER_PASSWORD: ${OPENLEARN_TEST_USER_PASSWORD:?Set OPENLEARN_TEST_USER_PASSWORD in .env.local}
    entrypoint: ["/bin/bash", "/opt/bootstrap/bootstrap-keycloak.sh"]
    volumes:
      - ./dev/bootstrap-keycloak.sh:/opt/bootstrap/bootstrap-keycloak.sh:ro
    depends_on:
      - keycloak
    restart: "no"

volumes:
  postgres_data:
  keycloak_dev_data:
