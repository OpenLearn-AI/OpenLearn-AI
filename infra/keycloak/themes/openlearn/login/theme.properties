# OpenLearn AI login theme (Batch 4.1 corrective follow-up).
#
# parent=keycloak keeps Keycloak's own FreeMarker templates intact, so
# every element ID and form behavior the product and the E2E suite depend
# on (#username, #password, #kc-login, #kc-page-title, ...) behaves
# exactly as before — this theme layers presentation and message copy
# only. There is no FTL override in this theme.
#
# locales=en,ar: the theme SHIPS both message bundles (messages_en /
# messages_ar) so Arabic renders correctly the moment the realm enables
# internationalization. The active realm export keeps
# internationalizationEnabled=false — realm provisioning is deliberately
# untouched by this theme (enabling i18n is an owner product decision);
# with i18n off Keycloak renders the default (English) bundle exactly as
# before.
#
# Message bundle naming: Keycloak loads per-locale bundles from
# messages/messages_<locale>.properties (the previous batch's
# messages/en.properties path was never read by the server — fixed here).

parent=keycloak

# A child theme's `styles=` list REPLACES the parent's, so the parent's
# layout stylesheet (css/login.css — card positioning, signup row, mobile
# collapse) must be listed explicitly BEFORE this theme's overrides.
# The previous batch declared only its own css/theme.css, which dropped
# the parent layout entirely — the main cause of the broken rendering.
styles=css/login.css css/theme.css

locales=en,ar
