# OpenLearn AI login theme (Batch 4.1 — Keycloak branding scope).
#
# parent=keycloak keeps Keycloak's own FreeMarker templates intact, so
# every element ID the product and the E2E suite depend on (#username,
# #password, #kc-login, #kc-page-title, ...) behaves exactly as before —
# this theme layers presentation and message copy only. There is no FTL
# override in this theme.
#
# `locales=en` matches the message bundle shipped below (messages/en.properties).
# The realm's internationalizationEnabled setting continues to control
# whether the locale selector renders.
parent=keycloak

styles=css/theme.css

locales=en
