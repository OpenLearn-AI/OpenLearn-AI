# OpenLearn AI login-theme message bundle — English (Batch 4.1 corrective follow-up).
#
# Bundle path: messages/messages_en.properties — the path Keycloak's theme
# loader actually reads (the previous batch's messages/en.properties was
# never loaded by the server, which is why the pages still showed the
# realm-name defaults).
#
# Keys are the ones the `keycloak` parent templates actually render
# (verified in the KC 26.7.3 base templates):
#   loginTitleHtml   — the page-level brand row on every auth page; the
#                      theme's CSS places the product logo tile next to it.
#   loginTitle       — the browser tab title ("Sign in to {0}" default).
#   loginAccountTitle — the LOGIN card's visible heading (the base login
#                      template renders this key, NOT loginTitle).
#   registerTitle    — the registration card's visible heading.
#
# Functional Keycloak message keys (labels, errors, field names) are NOT
# overridden, so authentication behavior and the E2E selectors
# (#username, #password, #kc-login) are unaffected.

loginTitleHtml=OpenLearn AI
loginTitle=Sign in to OpenLearn AI
loginAccountTitle=Sign in to OpenLearn AI

registerTitle=Create your account
