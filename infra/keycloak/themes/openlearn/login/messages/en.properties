# OpenLearn AI login-theme message bundle (Batch 4.1).
#
# Approved copy (Batch 4.1 design proposal §2.2/§2.3). Only headline /
# sub-line strings are overridden — Keycloak's own labels, errors, and
# field names are untouched, so authentication behavior and the test
# selectors (#username, #password, #kc-login) are unaffected.
#
# Key mapping (Keycloak's shared login template):
#   loginTitleHtml  — the page-level brand block at the top of every
#                     auth page (shared by login AND registration); the
#                     theme's CSS places the product logo next to it.
#   loginTitle      — the login card's visible heading (also the tab
#                     title). Keycloak's default is "Sign in to <realm>".
#   loginSubtitle   — the login card's sub-line (rendered when present).
#   registerTitle   — the registration card's visible heading.
#   registerSubtitle — the registration sub-line.

loginTitleHtml=OpenLearn AI
loginTitle=Sign in to OpenLearn AI
loginSubtitle=Welcome back — your courses are right where you left them.

registerTitle=Create your OpenLearn AI account
registerSubtitle=Set up your profile and bring your learning together.
