name: Deploy to Staging VPS

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "**.md"
      - "docs/**"

  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: openlearn-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlearn-${{ matrix.image }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlearn-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_URL }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ vars.NEXT_PUBLIC_KEYCLOAK_REALM }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "30m"

          script: |
            set -e

            cd ~/OpenLearn-AI || exit 1

            git fetch origin
            git checkout staging
            git pull origin staging

            # Create .env.runtime from GitHub Secrets/Variables.
            cat > infra/.env.runtime <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}

            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            IMAGE_TAG=sha-${{ github.sha }}

            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

            LITELLM_MASTER_KEY=${{ secrets.LITELLM_MASTER_KEY }}
            LITELLM_SALT_KEY=${{ secrets.LITELLM_SALT_KEY }}

            # Week 7-8 AI runtime (H1): gateway credential for the worker,
            # Gemini key for the gateway's reasoning upstream (litellm
            # container) AND the worker's direct Gemini OCR.
            LITELLM_API_KEY=${{ secrets.LITELLM_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}

            KEYCLOAK_ADMIN_USER=${{ secrets.KEYCLOAK_ADMIN_USER }}
            KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

            NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_URL }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ vars.NEXT_PUBLIC_KEYCLOAK_REALM }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}

            MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}

            S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME }}
            S3_REGION_NAME=${{ vars.S3_REGION_NAME }}
            S3_URL_EXPIRATION_SECONDS=${{ vars.S3_URL_EXPIRATION_SECONDS }}

            ENVIRONMENT=staging
            EOF

            chmod 600 infra/.env.runtime

            # Fail the deploy loudly if a Week 7-8 AI runtime secret is empty
            # or missing, instead of silently writing empty values that would
            # surface later as provider ConfigurationErrors (or, worse, be
            # papered over by re-enabling mock defaults). Only the variable
            # NAME is printed — never a secret value.
            for required_var in LITELLM_API_KEY GEMINI_API_KEY; do
              if ! grep -q "^${required_var}=..*" infra/.env.runtime; then
                echo "ERROR: required secret ${required_var} is empty or missing in .env.runtime."
                echo "       Create it in GitHub (Settings > Secrets and variables > Actions) before deploying."
                exit 1
              fi
            done

            chmod +x infra/deploy.sh

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            ./infra/deploy.sh sha-${{ github.sha }}

            docker logout ghcr.io
