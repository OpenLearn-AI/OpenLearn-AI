name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: openlearn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openlearn -d openlearn_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://openlearn:ci_password@localhost:5432/openlearn_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run pytest
        run: python -m pytest

  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check if frontend has a test script
        id: check_test_script
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if node -e "const s=require('./package.json').scripts; process.exit(s && s.test ? 0 : 1)"; then
            echo "has_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
      - name: Run Vitest
        if: steps.check_frontend.outputs.exists == 'true' && steps.check_test_script.outputs.has_test == 'true'
        working-directory: frontend
        run: npm run test -- --run
      - name: Skip test notice
        if: steps.check_frontend.outputs.exists == 'true' && steps.check_test_script.outputs.has_test == 'false'
        run: echo "frontend/package.json has no 'test' script yet — skipping Vitest step (Pod C hasn't added tests)."
      - name: Skip notice
        if: steps.check_frontend.outputs.exists == 'false'
        run: echo "No frontend/ folder yet — skipping frontend checks (Pod C hasn't scaffolded it)."

  eval:
    name: Run Eval Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Dummy Eval
        run: python -m app.eval run dummy --dataset tests/data/dummy.json
