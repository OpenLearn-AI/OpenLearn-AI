name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  backend:
    name: Backend (ruff + migrations + core tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Digest-pinned: CI tests against the same DB image staging runs.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: openlearn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openlearn -d openlearn_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://openlearn:ci_password@localhost:5432/openlearn_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run core pytest
        run: |
          python -m pytest tests --ignore=tests/pal --ignore=tests/documents \
            --cov=app --cov-report=term --cov-report=xml

  ai-tests:
    name: AI tests (PAL + documents)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Digest-pinned: CI tests against the same DB image staging runs.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: openlearn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openlearn -d openlearn_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://openlearn:ci_password@localhost:5432/openlearn_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run AI pytest
        run: python -m pytest tests/pal tests/documents

  frontend:
    name: Frontend (lint + typecheck + unit tests + Storybook tests + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Install Playwright browser for Storybook tests
        # Storybook component tests run in a real browser via
        # @vitest/browser-playwright (chromium). The browser binary must
        # be present before `npm run test:storybook` runs.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Run Storybook tests
        # Includes axe a11y verification at `test: 'error'` (Phase 5 baseline).
        # A violation fails the story test, which fails this step.
        working-directory: frontend
        run: npm run test:storybook

      - name: Build
        working-directory: frontend
        # NEXT_PUBLIC_* values are required at build time — lib/config.ts
        # does Zod validation at module load and throws if they're missing.
        # CI reads from GitHub repository Variables (non-secret config).
        # The `||` fallbacks use the .env.example defaults so CI still
        # passes on a fresh fork that hasn't configured repo Variables yet.
        # Real deployment values come from the same repo Variables in
        # deploy-staging.yml (build-args) — this keeps CI and deploy
        # consistent without duplicating config in the workflow file.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ vars.NEXT_PUBLIC_KEYCLOAK_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ vars.NEXT_PUBLIC_KEYCLOAK_REALM || 'openlearn' }}
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'openlearn-frontend' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || 'development' }}
        run: npm run build

  eval:
    name: Run Eval Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Dummy Eval
        run: python -m app.eval run dummy --dataset tests/data/dummy.json
