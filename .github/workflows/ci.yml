name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  backend:
    name: Backend (ruff + migrations + core tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Digest-pinned: CI tests against the same DB image staging runs.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: openlearn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openlearn -d openlearn_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://openlearn:ci_password@localhost:5432/openlearn_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run core pytest
        run: python -m pytest tests --ignore=tests/pal --ignore=tests/documents

  ai-tests:
    name: AI tests (PAL + documents)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Digest-pinned: CI tests against the same DB image staging runs.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: openlearn
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: openlearn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openlearn -d openlearn_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://openlearn:ci_password@localhost:5432/openlearn_dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run AI pytest
        run: python -m pytest tests/pal tests/documents

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for a test script
        id: check_test_script
        working-directory: frontend
        run: |
          if node -e "const s=require('./package.json').scripts; process.exit(s && s.test ? 0 : 1)"; then
            echo "has_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest
        if: steps.check_test_script.outputs.has_test == 'true'
        working-directory: frontend
        run: npm run test -- --run

      - name: Skip test notice
        if: steps.check_test_script.outputs.has_test == 'false'
        run: echo "frontend/package.json has no 'test' script yet — skipping Vitest step (Pod C hasn't added tests)."

  eval:
    name: Run Eval Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Dummy Eval
        run: python -m app.eval run dummy --dataset tests/data/dummy.json
