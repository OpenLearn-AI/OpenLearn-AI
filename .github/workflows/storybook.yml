name: Storybook

on:
  pull_request:

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (matching the Dockerfile's node:22 build image) is
          # required by the pinned chromaui/action below: chromatic CLI
          # 18.13.3 declares engines >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Batch 5.3 (W7): the action is pinned to the full commit SHA of
      # the chromatic 18.13.3 tag — the Storybook-10 companion family
      # the devDependencies pin (`chromatic ^18.7.2`,
      # `@chromatic-com/storybook 5.3.1`). `@latest` resolves to the
      # repository's single stale release tag `v1`, whose chromatic
      # CLI 11.x predates Storybook 10, so the "latest" float was not
      # actually tracking the current family.
      - name: Publish Storybook to Chromatic
        uses: chromaui/action@aa9da972161ca3bb13211a76be5dc5ba5c2f0395 # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend

